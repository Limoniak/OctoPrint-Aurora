[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-Aurora"
version = "0.2.2"
description = "A complete visual redesign of the OctoPrint web interface: modern cards, dark mode, accent colors and a fluid layout."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Baptiste Dhumaux", email = "30498542+Limoniak@users.noreply.github.com" }]
requires-python = ">=3.7, <4"
dependencies = []
classifiers = [
    "Framework :: OctoPrint",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Limoniak/OctoPrint-Aurora"
Issues = "https://github.com/Limoniak/OctoPrint-Aurora/issues"
Changelog = "https://github.com/Limoniak/OctoPrint-Aurora/blob/main/CHANGELOG.md"

[project.entry-points."octoprint.plugin"]
aurora = "octoprint_aurora"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["octoprint_aurora", "octoprint_aurora.*"]

[tool.setuptools.package-data]
octoprint_aurora = ["static/**/*", "templates/**/*", "translations/**/*"]
